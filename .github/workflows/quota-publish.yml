name: Publish Package
on:
  push:
    tags: ['v*']
permissions:
  id-token: write   # OIDC：允许 mint ID token 供 npm trusted publishing 认证
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # 无依赖、无 build 步骤：直接发布（trusted publishing 自动生成 provenance）
      - run: npm publish
